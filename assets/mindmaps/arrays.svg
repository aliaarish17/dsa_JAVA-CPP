<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Arrays &amp; Strings">
  <title>Arrays &amp; Strings</title>
  <defs>
    <pattern id="grid-arrays" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#071208"/>
      <rect width="16" height="1" fill="#143016" opacity="0.55"/>
      <rect width="1" height="16" fill="#143016" opacity="0.55"/>
    </pattern>
    <filter id="glow-arrays" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan-arrays" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <style>
      .edge-arrays {
        fill: none;
        stroke: #55C500;
        stroke-width: 2.5;
        stroke-linecap: square;
        stroke-dasharray: 10 6;
        animation: march-arrays 1.1s linear infinite;
      }
      .pulse-arrays {
        animation: pulse-arrays 2.6s ease-in-out infinite;
      }
      .twinkle-arrays {
        animation: twinkle-arrays 2.2s ease-in-out infinite;
      }
      @keyframes march-arrays {
        to { stroke-dashoffset: -16; }
      }
      @keyframes pulse-arrays {
        0%, 100% { filter: url(#glow-arrays); }
        50% { filter: none; }
      }
      @keyframes twinkle-arrays {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
    </style>
  </defs>
