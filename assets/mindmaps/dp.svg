<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Dynamic Programming">
  <title>Dynamic Programming</title>
  <defs>
    <pattern id="grid-dp" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#160606"/>
      <rect width="16" height="1" fill="#2a0c0c" opacity="0.55"/>
      <rect width="1" height="16" fill="#2a0c0c" opacity="0.55"/>
    </pattern>
    <filter id="glow-dp" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan-dp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <style>
      .edge-dp {
        fill: none;
        stroke: #E24A4A;
        stroke-width: 2.5;
        stroke-linecap: square;
        stroke-dasharray: 10 6;
        animation: march-dp 1.1s linear infinite;
      }
      .pulse-dp {
        animation: pulse-dp 2.6s ease-in-out infinite;
      }
      .twinkle-dp {
        animation: twinkle-dp 2.2s ease-in-out infinite;
      }
      @keyframes march-dp {
        to { stroke-dashoffset: -16; }
      }
      @keyframes pulse-dp {
        0%, 100% { filter: url(#glow-dp); }
        50% { filter: none; }
      }
      @keyframes twinkle-dp {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid-dp)"/>
  <rect x="8" y="8" width="984" height="624" fill="none" stroke="#FF5555" stroke-width="3"/>
  <rect x="14" y="14" width="972" height="612" fill="none" stroke="#B33939" stroke-width="1" opacity="0.7"/>
  <rect width="100%" height="100%" fill="url(#scan-dp)"/>
  <circle class="twinkle-dp" cx="36" cy="36" r="3" fill="#FF5555"/>
  <circle class="twinkle-dp" cx="964" cy="42" r="2.5" fill="#FF5555" style="animation-delay:0.6s"/>
  <circle class="twinkle-dp" cx="952" cy="606" r="3" fill="#FF5555" style="animation-delay:1.1s"/>
  <text x="28" y="42" fill="#FF9A9A" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="11" letter-spacing="2">ENDER DRAGON LOOT</text>
  <text x="28" y="66" fill="#FFE4E4" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="700">Dynamic Programming</text>
