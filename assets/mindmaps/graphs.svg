  <g class="pulse-graphs" style="animation-delay:0.02s" filter="url(#glow-graphs)">
    <rect x="402.0" y="292" width="196" height="76" fill="#12343f" stroke="#4AC6E8" stroke-width="2.5"/>
    <rect x="405.0" y="295" width="190" height="2" fill="#4AC6E8" opacity="0.35"/>
    <text x="500.0" y="330.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="700">GRAPHS</text>
