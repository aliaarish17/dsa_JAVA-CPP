    <text x="896.0" y="207.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Dijkstra</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.26s">
    <rect x="814" y="225.0" width="164" height="28" fill="#071c24" stroke="#2D6B80" stroke-width="2.5"/>
    <rect x="817" y="228.0" width="158" height="2" fill="#2D6B80" opacity="0.35"/>
    <text x="896.0" y="239.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">BFS unweighted</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.21s">
    <rect x="634" y="462.0" width="168" height="42" fill="#1b5566" stroke="#5ED4F0" stroke-width="2.5"/>
    <rect x="637" y="465.0" width="162" height="2" fill="#5ED4F0" opacity="0.35"/>
    <text x="718.0" y="483.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700">Topo Sort</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.31s">
    <rect x="814" y="451.0" width="164" height="28" fill="#071c24" stroke="#2D6B80" stroke-width="2.5"/>
    <rect x="817" y="454.0" width="158" height="2" fill="#2D6B80" opacity="0.35"/>
    <text x="896.0" y="465.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Course schedule</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.35s">
    <rect x="814" y="483.0" width="164" height="28" fill="#071c24" stroke="#2D6B80" stroke-width="2.5"/>
    <rect x="817" y="486.0" width="158" height="2" fill="#2D6B80" opacity="0.35"/>
    <text x="896.0" y="497.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Task ordering</text>
