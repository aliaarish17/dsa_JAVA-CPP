    <text x="282.0" y="483.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700">Union-Find</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.31s">
    <rect x="22" y="451.0" width="164" height="28" fill="#071c24" stroke="#2D6B80" stroke-width="2.5"/>
    <rect x="25" y="454.0" width="158" height="2" fill="#2D6B80" opacity="0.35"/>
    <text x="104.0" y="465.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Cycle detection</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.35s">
