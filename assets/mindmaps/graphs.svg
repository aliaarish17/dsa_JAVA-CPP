  <path class="edge-graphs" d="M802.0,483.0 C808.0,483.0 808.0,465.0 814.0,465.0"/>
  <path class="edge-graphs" d="M802.0,483.0 C808.0,483.0 808.0,497.0 814.0,497.0"/>
  <g class="node-graphs" style="animation-delay:0.12s">
    <rect x="198" y="204.0" width="168" height="42" fill="#1b5566" stroke="#5ED4F0" stroke-width="2.5"/>
    <rect x="201" y="207.0" width="162" height="2" fill="#5ED4F0" opacity="0.35"/>
    <text x="282.0" y="225.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700">Traversal</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.22s">
    <rect x="22" y="193.0" width="164" height="28" fill="#071c24" stroke="#2D6B80" stroke-width="2.5"/>
