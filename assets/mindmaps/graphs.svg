<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Graphs">
  <title>Graphs</title>
  <defs>
    <pattern id="grid-graphs" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#061318"/>
      <rect width="16" height="1" fill="#0d2a33" opacity="0.55"/>
      <rect width="1" height="16" fill="#0d2a33" opacity="0.55"/>
    </pattern>
    <filter id="glow-graphs" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan-graphs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <style>
      .edge-graphs {
        fill: none;
        stroke: #3EB7D6;
        stroke-width: 2.5;
        stroke-linecap: square;
        stroke-dasharray: 10 6;
        animation: march-graphs 1.1s linear infinite;
      }
      .pulse-graphs {
        animation: pulse-graphs 2.6s ease-in-out infinite;
      }
      .twinkle-graphs {
        animation: twinkle-graphs 2.2s ease-in-out infinite;
      }
      @keyframes march-graphs {
        to { stroke-dashoffset: -16; }
      }
      @keyframes pulse-graphs {
        0%, 100% { filter: url(#glow-graphs); }
        50% { filter: none; }
      }
      @keyframes twinkle-graphs {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid-graphs)"/>
  <rect x="8" y="8" width="984" height="624" fill="none" stroke="#4AC6E8" stroke-width="3"/>
  <rect x="14" y="14" width="972" height="612" fill="none" stroke="#2D6B80" stroke-width="1" opacity="0.7"/>
  <rect width="100%" height="100%" fill="url(#scan-graphs)"/>
  <circle class="twinkle-graphs" cx="36" cy="36" r="3" fill="#4AC6E8"/>
  <circle class="twinkle-graphs" cx="964" cy="42" r="2.5" fill="#4AC6E8" style="animation-delay:0.6s"/>
  <circle class="twinkle-graphs" cx="952" cy="606" r="3" fill="#4AC6E8" style="animation-delay:1.1s"/>
  <text x="28" y="42" fill="#7FD4EA" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="11" letter-spacing="2">THE END BIOME</text>
  <text x="28" y="66" fill="#D7F6FF" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="700">Graphs</text>
  <path class="edge-graphs" d="M402.0,330.0 C384.0,330.0 384.0,225.0 366.0,225.0"/>
  <path class="edge-graphs" d="M198.0,225.0 C192.0,225.0 192.0,207.0 186.0,207.0"/>
  <path class="edge-graphs" d="M198.0,225.0 C192.0,225.0 192.0,239.0 186.0,239.0"/>
  <path class="edge-graphs" d="M402.0,330.0 C384.0,330.0 384.0,483.0 366.0,483.0"/>
  <path class="edge-graphs" d="M198.0,483.0 C192.0,483.0 192.0,465.0 186.0,465.0"/>
  <path class="edge-graphs" d="M198.0,483.0 C192.0,483.0 192.0,497.0 186.0,497.0"/>
  <path class="edge-graphs" d="M598.0,330.0 C616.0,330.0 616.0,225.0 634.0,225.0"/>
  <path class="edge-graphs" d="M802.0,225.0 C808.0,225.0 808.0,207.0 814.0,207.0"/>
  <path class="edge-graphs" d="M802.0,225.0 C808.0,225.0 808.0,239.0 814.0,239.0"/>
