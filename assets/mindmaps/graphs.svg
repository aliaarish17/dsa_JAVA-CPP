    <rect x="25" y="228.0" width="158" height="2" fill="#2D6B80" opacity="0.35"/>
    <text x="104.0" y="239.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">DFS</text>
  </g>
  <g class="node-graphs" style="animation-delay:0.21s">
    <rect x="198" y="462.0" width="168" height="42" fill="#1b5566" stroke="#5ED4F0" stroke-width="2.5"/>
