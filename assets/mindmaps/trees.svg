<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Trees">
  <title>Trees</title>
  <defs>
    <pattern id="grid-trees" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#071208"/>
      <rect width="16" height="1" fill="#143016" opacity="0.55"/>
      <rect width="1" height="16" fill="#143016" opacity="0.55"/>
    </pattern>
    <filter id="glow-trees" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan-trees" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <style>
      .edge-trees {
        fill: none;
        stroke: #55C500;
        stroke-width: 2.5;
        stroke-linecap: square;
        stroke-dasharray: 10 6;
        animation: march-trees 1.1s linear infinite;
      }
      .pulse-trees {
        animation: pulse-trees 2.6s ease-in-out infinite;
      }
      .twinkle-trees {
        animation: twinkle-trees 2.2s ease-in-out infinite;
      }
      @keyframes march-trees {
        to { stroke-dashoffset: -16; }
      }
      @keyframes pulse-trees {
        0%, 100% { filter: url(#glow-trees); }
        50% { filter: none; }
      }
      @keyframes twinkle-trees {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid-trees)"/>
  <rect x="8" y="8" width="984" height="624" fill="none" stroke="#7CFF4A" stroke-width="3"/>
  <rect x="14" y="14" width="972" height="612" fill="none" stroke="#4A7C1F" stroke-width="1" opacity="0.7"/>
  <rect width="100%" height="100%" fill="url(#scan-trees)"/>
  <circle class="twinkle-trees" cx="36" cy="36" r="3" fill="#55C500"/>
  <circle class="twinkle-trees" cx="964" cy="42" r="2.5" fill="#55C500" style="animation-delay:0.6s"/>
  <circle class="twinkle-trees" cx="952" cy="606" r="3" fill="#55C500" style="animation-delay:1.1s"/>
  <text x="28" y="42" fill="#9CCC7A" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="11" letter-spacing="2">DARK FOREST BIOME</text>
  <text x="28" y="66" fill="#E8F5D8" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="700">Trees</text>
  <path class="edge-trees" d="M402.0,330.0 C384.0,330.0 384.0,225.0 366.0,225.0"/>
  <path class="edge-trees" d="M198.0,225.0 C192.0,225.0 192.0,191.0 186.0,191.0"/>
  <path class="edge-trees" d="M198.0,225.0 C192.0,225.0 192.0,223.0 186.0,223.0"/>
  <path class="edge-trees" d="M198.0,225.0 C192.0,225.0 192.0,255.0 186.0,255.0"/>
  <path class="edge-trees" d="M402.0,330.0 C384.0,330.0 384.0,483.0 366.0,483.0"/>
  <path class="edge-trees" d="M198.0,483.0 C192.0,483.0 192.0,465.0 186.0,465.0"/>
  <path class="edge-trees" d="M198.0,483.0 C192.0,483.0 192.0,497.0 186.0,497.0"/>
  <path class="edge-trees" d="M598.0,330.0 C616.0,330.0 616.0,225.0 634.0,225.0"/>
  <path class="edge-trees" d="M802.0,225.0 C808.0,225.0 808.0,207.0 814.0,207.0"/>
  <path class="edge-trees" d="M802.0,225.0 C808.0,225.0 808.0,239.0 814.0,239.0"/>
  <path class="edge-trees" d="M598.0,330.0 C616.0,330.0 616.0,483.0 634.0,483.0"/>
  <path class="edge-trees" d="M802.0,483.0 C808.0,483.0 808.0,481.0 814.0,481.0"/>
  <g class="node-trees" style="animation-delay:0.12s">
    <rect x="198" y="204.0" width="168" height="42" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="201" y="207.0" width="162" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="282.0" y="225.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700">DFS</text>
  </g>
  <g class="node-trees" style="animation-delay:0.22s">
    <rect x="22" y="177.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="25" y="180.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="104.0" y="191.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Pre / In / Post</text>
  </g>
  <g class="node-trees" style="animation-delay:0.26s">
    <rect x="22" y="209.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="25" y="212.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="104.0" y="223.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Path sum</text>
  </g>
  <g class="node-trees" style="animation-delay:0.3s">
    <rect x="22" y="241.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="25" y="244.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="104.0" y="255.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Diameter</text>
  </g>
  <g class="node-trees" style="animation-delay:0.21s">
    <rect x="198" y="462.0" width="168" height="42" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="201" y="465.0" width="162" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="282.0" y="483.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700">BST Properties</text>
  </g>
  <g class="node-trees" style="animation-delay:0.31s">
    <rect x="22" y="451.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="25" y="454.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="104.0" y="465.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Validate BST</text>
  </g>
  <g class="node-trees" style="animation-delay:0.35s">
    <rect x="22" y="483.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="25" y="486.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="104.0" y="497.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Kth smallest</text>
  </g>
  <g class="node-trees" style="animation-delay:0.12s">
    <rect x="634" y="204.0" width="168" height="42" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="637" y="207.0" width="162" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="718.0" y="225.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700">BFS</text>
  </g>
  <g class="node-trees" style="animation-delay:0.22s">
    <rect x="814" y="193.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="817" y="196.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="896.0" y="207.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Level order</text>
  </g>
  <g class="node-trees" style="animation-delay:0.26s">
    <rect x="814" y="225.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="817" y="228.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="896.0" y="239.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Zigzag traversal</text>
  </g>
  <g class="node-trees" style="animation-delay:0.21s">
    <rect x="634" y="462.0" width="168" height="42" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="637" y="465.0" width="162" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="718.0" y="483.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="700">Backtracking</text>
  </g>
  <g class="node-trees" style="animation-delay:0.31s">
    <rect x="814" y="467.0" width="164" height="28" fill="#102410" stroke="#4A7C1F" stroke-width="2.5"/>
    <rect x="817" y="470.0" width="158" height="2" fill="#4A7C1F" opacity="0.35"/>
    <text x="896.0" y="481.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Root to leaf paths</text>
  </g>
  <g class="pulse-trees" style="animation-delay:0.02s" filter="url(#glow-trees)">
    <rect x="402.0" y="292" width="196" height="76" fill="#1d4a18" stroke="#7CFF4A" stroke-width="2.5"/>
    <rect x="405.0" y="295" width="190" height="2" fill="#7CFF4A" opacity="0.35"/>
    <text x="500.0" y="330.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="700">TREES</text>
  </g>
</svg>
