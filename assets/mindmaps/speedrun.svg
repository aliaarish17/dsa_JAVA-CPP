<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="How I Speedrun a Problem">
  <title>How I Speedrun a Problem</title>
  <defs>
    <pattern id="grid-speedrun" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#071208"/>
      <rect width="16" height="1" fill="#143016" opacity="0.55"/>
      <rect width="1" height="16" fill="#143016" opacity="0.55"/>
    </pattern>
    <filter id="glow-speedrun" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan-speedrun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <style>
      .edge-speedrun {
        fill: none;
        stroke: #55C500;
        stroke-width: 2.5;
        stroke-linecap: square;
        stroke-dasharray: 10 6;
        animation: march-speedrun 1.1s linear infinite;
      }
      .pulse-speedrun {
        animation: pulse-speedrun 2.6s ease-in-out infinite;
      }
      .twinkle-speedrun {
        animation: twinkle-speedrun 2.2s ease-in-out infinite;
      }
      @keyframes march-speedrun {
        to { stroke-dashoffset: -16; }
      }
      @keyframes pulse-speedrun {
        0%, 100% { filter: url(#glow-speedrun); }
        50% { filter: none; }
      }
      @keyframes twinkle-speedrun {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid-speedrun)"/>
  <rect x="8" y="8" width="984" height="234" fill="none" stroke="#7CFF4A" stroke-width="3"/>
  <rect x="14" y="14" width="972" height="222" fill="none" stroke="#4A7C1F" stroke-width="1" opacity="0.7"/>
  <rect width="100%" height="100%" fill="url(#scan-speedrun)"/>
  <circle class="twinkle-speedrun" cx="36" cy="36" r="3" fill="#55C500"/>
  <circle class="twinkle-speedrun" cx="964" cy="42" r="2.5" fill="#55C500" style="animation-delay:0.6s"/>
  <circle class="twinkle-speedrun" cx="952" cy="216" r="3" fill="#55C500" style="animation-delay:1.1s"/>
  <text x="28" y="42" fill="#9CCC7A" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="11" letter-spacing="2">QUEST PIPELINE</text>
  <text x="28" y="66" fill="#E8F5D8" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="700">How I Speedrun a Problem</text>
  <path class="edge-speedrun" d="M116.0,145.0 L132.0,145.0"/>
  <path class="edge-speedrun" d="M210.0,145.0 L226.0,145.0"/>
  <path class="edge-speedrun" d="M304.0,145.0 L320.0,145.0"/>
  <path class="edge-speedrun" d="M398.0,145.0 L414.0,145.0"/>
  <path class="edge-speedrun" d="M492.0,145.0 L508.0,145.0"/>
  <path class="edge-speedrun" d="M586.0,145.0 L602.0,145.0"/>
  <path class="edge-speedrun" d="M680.0,145.0 L696.0,145.0"/>
  <path class="edge-speedrun" d="M774.0,145.0 L790.0,145.0"/>
  <path class="edge-speedrun" d="M868.0,145.0 L884.0,145.0"/>
  <g class="pulse-speedrun" style="animation-delay:0.0s" filter="url(#glow-speedrun)">
    <rect x="38.0" y="120" width="78" height="50" fill="#1d4a18" stroke="#7CFF4A" stroke-width="2.5"/>
    <rect x="41.0" y="123" width="72" height="2" fill="#7CFF4A" opacity="0.35"/>
    <text x="77.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Read</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.06s">
    <rect x="132.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="135.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="171.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Goal</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.12s">
    <rect x="226.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="229.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="265.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Brute</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.18s">
    <rect x="320.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="323.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="359.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Bottleneck</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.24s">
    <rect x="414.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="417.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="453.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Pattern</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.3s">
    <rect x="508.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="511.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="547.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Optimize</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.36s">
    <rect x="602.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="605.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="641.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Code</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.42s">
    <rect x="696.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="699.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="735.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Edges</text>
  </g>
  <g class="node-speedrun" style="animation-delay:0.48s">
    <rect x="790.0" y="120" width="78" height="50" fill="#2d5a1e" stroke="#8BC34A" stroke-width="2.5"/>
    <rect x="793.0" y="123" width="72" height="2" fill="#8BC34A" opacity="0.35"/>
    <text x="829.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">TC/SC</text>
  </g>
  <g class="pulse-speedrun" style="animation-delay:0.54s" filter="url(#glow-speedrun)">
    <rect x="884.0" y="120" width="78" height="50" fill="#1d4a18" stroke="#7CFF4A" stroke-width="2.5"/>
    <rect x="887.0" y="123" width="72" height="2" fill="#7CFF4A" opacity="0.35"/>
    <text x="923.0" y="145.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">Next</text>
  </g>
</svg>
