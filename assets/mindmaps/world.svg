<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="The Mining Map">
  <title>The Mining Map</title>
  <defs>
    <pattern id="grid-world" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#071208"/>
      <rect width="16" height="1" fill="#143016" opacity="0.55"/>
      <rect width="1" height="16" fill="#143016" opacity="0.55"/>
    </pattern>
    <filter id="glow-world" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scan-world" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <style>
      .edge-world {
        fill: none;
        stroke: #55C500;
        stroke-width: 2.5;
        stroke-linecap: square;
        stroke-dasharray: 10 6;
        animation: march-world 1.1s linear infinite;
      }
      .pulse-world {
        animation: pulse-world 2.6s ease-in-out infinite;
      }
      .twinkle-world {
        animation: twinkle-world 2.2s ease-in-out infinite;
      }
      @keyframes march-world {
        to { stroke-dashoffset: -16; }
      }
      @keyframes pulse-world {
        0%, 100% { filter: url(#glow-world); }
        50% { filter: none; }
      }
      @keyframes twinkle-world {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.95; }
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid-world)"/>
  <rect x="8" y="8" width="984" height="584" fill="none" stroke="#7CFF4A" stroke-width="3"/>
  <rect x="14" y="14" width="972" height="572" fill="none" stroke="#4A7C1F" stroke-width="1" opacity="0.7"/>
  <rect width="100%" height="100%" fill="url(#scan-world)"/>
  <circle class="twinkle-world" cx="36" cy="36" r="3" fill="#55C500"/>
  <circle class="twinkle-world" cx="964" cy="42" r="2.5" fill="#55C500" style="animation-delay:0.6s"/>
  <circle class="twinkle-world" cx="952" cy="566" r="3" fill="#55C500" style="animation-delay:1.1s"/>
  <text x="28" y="42" fill="#9CCC7A" font-family="ui-monospace, Cascadia Code, Consolas, monospace" font-size="11" letter-spacing="2">WORLD SAVE // BIOMES</text>
  <text x="28" y="66" fill="#E8F5D8" font-family="Segoe UI, Tahoma, sans-serif" font-size="20" font-weight="700">The Mining Map</text>
  <path class="edge-world" d="M500,118 C500,128 192,132 192,140"/>
  <path class="edge-world" d="M192,368 C192,400 500,412 500,430"/>
  <path class="edge-world" d="M500,118 C500,128 500,132 500,140"/>
  <path class="edge-world" d="M500,368 C500,400 500,412 500,430"/>
  <path class="edge-world" d="M500,118 C500,128 808,132 808,140"/>
  <path class="edge-world" d="M808,368 C808,400 500,412 500,430"/>
  <g class="node-world" style="animation-delay:0.12s">
    <rect x="52" y="140" width="280" height="228" fill="#1d4a18" stroke="#7CFF4A" stroke-width="3"/>
    <rect x="60" y="148" width="264" height="8" fill="#7CFF4A" opacity="0.35"/>
    <text x="192" y="184" text-anchor="middle" fill="#E8F5D8" font-size="18" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif"></text>
    <text x="192" y="206" text-anchor="middle" fill="#9CCC7A" font-size="11" font-family="ui-monospace, Consolas, monospace"></text>
    <rect x="80" y="228" width="224" height="32" fill="#102410" stroke="#4A7C1F" stroke-width="2"/><text x="192" y="248" text-anchor="middle" fill="#E8F5D8" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Arrays</text><rect x="80" y="270" width="224" height="32" fill="#102410" stroke="#4A7C1F" stroke-width="2"/><text x="192" y="290" text-anchor="middle" fill="#E8F5D8" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Strings</text><rect x="80" y="312" width="224" height="32" fill="#102410" stroke="#4A7C1F" stroke-width="2"/><text x="192" y="332" text-anchor="middle" fill="#E8F5D8" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Recursion</text>
  </g>
  <g class="node-world" style="animation-delay:0.22s">
    <rect x="360" y="140" width="280" height="228" fill="#4a2a12" stroke="#FFB020" stroke-width="3"/>
    <rect x="368" y="148" width="264" height="8" fill="#FFB020" opacity="0.35"/>
    <text x="500" y="184" text-anchor="middle" fill="#FFE7B0" font-size="18" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">THE NETHER</text>
    <text x="500" y="206" text-anchor="middle" fill="#C9A227" font-size="11" font-family="ui-monospace, Consolas, monospace">gold rush at 2am</text>
    <rect x="388" y="228" width="224" height="32" fill="#241408" stroke="#8A6420" stroke-width="2"/><text x="500" y="248" text-anchor="middle" fill="#FFE7B0" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Hashing</text><rect x="388" y="270" width="224" height="32" fill="#241408" stroke="#8A6420" stroke-width="2"/><text x="500" y="290" text-anchor="middle" fill="#FFE7B0" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Sort / Search</text><rect x="388" y="312" width="224" height="32" fill="#241408" stroke="#8A6420" stroke-width="2"/><text x="500" y="332" text-anchor="middle" fill="#FFE7B0" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Linked List</text>
  </g>
  <g class="node-world" style="animation-delay:0.32s">
    <rect x="668" y="140" width="280" height="228" fill="#12343f" stroke="#4AC6E8" stroke-width="3"/>
    <rect x="676" y="148" width="264" height="8" fill="#4AC6E8" opacity="0.35"/>
    <text x="808" y="184" text-anchor="middle" fill="#D7F6FF" font-size="18" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">THE END</text>
    <text x="808" y="206" text-anchor="middle" fill="#7FD4EA" font-size="11" font-family="ui-monospace, Consolas, monospace">not emotionally ready</text>
    <rect x="696" y="228" width="224" height="32" fill="#071c24" stroke="#2D6B80" stroke-width="2"/><text x="808" y="248" text-anchor="middle" fill="#D7F6FF" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Trees / Graphs</text><rect x="696" y="270" width="224" height="32" fill="#071c24" stroke="#2D6B80" stroke-width="2"/><text x="808" y="290" text-anchor="middle" fill="#D7F6FF" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">DP</text><rect x="696" y="312" width="224" height="32" fill="#071c24" stroke="#2D6B80" stroke-width="2"/><text x="808" y="332" text-anchor="middle" fill="#D7F6FF" font-size="13" font-weight="700" font-family="Segoe UI, Tahoma, sans-serif">Greedy</text>
  </g>
  <g class="pulse-world" style="animation-delay:0.02s" filter="url(#glow-world)">
    <rect x="392" y="78" width="216" height="40" fill="#1d4a18" stroke="#7CFF4A" stroke-width="2.5"/>
    <rect x="395" y="81" width="210" height="2" fill="#7CFF4A" opacity="0.35"/>
    <text x="500.0" y="98.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="700">DSA WORLD SAVE</text>
  </g>
  <g class="pulse-world" style="animation-delay:0.5s" filter="url(#glow-world)">
    <rect x="280" y="430" width="440" height="72" fill="#5a1010" stroke="#FF5555" stroke-width="2.5"/>
    <rect x="283" y="433" width="434" height="2" fill="#FF5555" opacity="0.35"/>
    <text x="500.0" y="466.0" text-anchor="middle" dominant-baseline="middle" fill="white" font-family="Segoe UI, Tahoma, sans-serif" font-size="16" font-weight="700">ENDER DRAGON  ·  the interview</text>
  </g>
</svg>
